[project]
name = "srebook"
version = "0.1.0"
description = "Turns TIFF page scans into searchable, bookmarked, page-labeled PDFs"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pikepdf>=9",
    "lxml>=5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdfium2>=4"]

[project.scripts]
srebook = "srebook.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
